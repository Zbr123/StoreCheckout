name: Daily Automated Tests

on:
  # Run every day at 07:30 AM Pakistan time (GMT+5) = 02:30 UTC
  schedule:
    - cron: '30 2 * * *'
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
  
  # Optional: Run on push to main/master for testing the pipeline
  # push:
  #   branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Sufficient time for parallel execution with setup
    
    strategy:
      fail-fast: false
      matrix:
        # You can add multiple environments or browsers if needed
        browser: [chromium]
        # browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      
      - name: Create reports directory
        run: mkdir -p reports
      
      - name: Run tests
        run: npm run test:store -- --parallel 5 --format html:reports/cucumber-report.html --format progress-bar
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://9975.qa-bkstr.com' }}
        continue-on-error: true
      
      - name: List reports directory
        if: always()
        run: ls -la reports/ || echo "Reports directory not found"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            reports/
            test-results/
            *.png
          retention-days: 30
      
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: Test Report Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser**: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "Tests failed! Check the artifacts for details."
            exit 1
          else
            echo "All tests passed successfully!"
          fi
      
     
