# GitLab CI Pipeline - Runs daily automated tests
# Documentation: https://docs.gitlab.com/ee/ci/

# Define when the pipeline runs
workflow:
  rules:
    # Run on schedules (set up in GitLab UI: CI/CD > Schedules)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Allow manual runs
    - if: $CI_PIPELINE_SOURCE == "web"
    # Optional: Run on push to main/master
    # - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

stages:
  - test
  - report

variables:
  NODE_VERSION: "20"
  BASE_URL: "https://9975.qa-bkstr.com"

# Cache node_modules for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# Run tests
test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  
  before_script:
    - npm ci --cache .npm --prefer-offline
  
  script:
    - npm run test:store
  
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - playwright-report/
      - test-results/
      - "*.png"
    reports:
      junit: test-results/junit.xml
  
  allow_failure: false
  
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Optional: Generate and publish report
publish-report:
  stage: report
  image: node:20
  
  dependencies:
    - test
  
  script:
    - echo "Test execution completed"
    - ls -la playwright-report/ || echo "No report directory"
  
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - playwright-report/
  
  only:
    - schedules
    - web

# To set up the 24-hour schedule in GitLab:
# 1. Go to your project in GitLab
# 2. Navigate to CI/CD > Schedules
# 3. Click "New schedule"
# 4. Set interval to: 0 2 * * * (runs daily at 2 AM UTC)
# 5. Set timezone and target branch
# 6. Save the schedule

