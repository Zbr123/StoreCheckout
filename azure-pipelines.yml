# Azure Pipelines - Runs daily automated tests
# Documentation: https://docs.microsoft.com/azure/devops/pipelines

# Schedule: Run every day at 2 AM UTC
schedules:
  - cron: "0 2 * * *"
    displayName: Daily automated test run
    branches:
      include:
        - main
        - master
    always: true

# Trigger on manual runs and optionally on pushes
trigger:
  branches:
    include:
      - main
      - master

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  BASE_URL: 'https://9975.qa-bkstr.com'

stages:
  - stage: Test
    displayName: 'Run Automated Tests'
    jobs:
      - job: PlaywrightTests
        displayName: 'Execute Playwright + Cucumber Tests'
        timeoutInMinutes: 60
        
        strategy:
          matrix:
            Chromium:
              browserName: 'chromium'
            # Uncomment to test on multiple browsers
            # Firefox:
            #   browserName: 'firefox'
            # WebKit:
            #   browserName: 'webkit'
        
        steps:
          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)
          
          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: |
                npm | "$(Agent.OS)"
          
          - script: npm ci
            displayName: 'Install dependencies'
          
          - script: npx playwright install --with-deps $(browserName)
            displayName: 'Install Playwright browsers'
          
          - script: npm run test:store
            displayName: 'Run tests'
            env:
              CI: true
              BASE_URL: $(BASE_URL)
            continueOnError: true
          
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Playwright Tests - $(browserName)'
          
          - task: PublishPipelineArtifact@1
            displayName: 'Upload test artifacts'
            condition: always()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)'
              artifact: 'test-results-$(browserName)-$(Build.BuildNumber)'
              publishLocation: 'pipeline'
              parallel: true
              patterns: |
                playwright-report/**
                test-results/**
                *.png
          
          - task: PublishBuildArtifacts@1
            displayName: 'Upload Playwright Report'
            condition: always()
            inputs:
              PathtoPublish: 'playwright-report'
              ArtifactName: 'playwright-report-$(browserName)'
              publishLocation: 'Container'

  - stage: Notify
    displayName: 'Notify Results'
    dependsOn: Test
    condition: always()
    jobs:
      - job: NotifyTeam
        displayName: 'Send Notifications'
        steps:
          - script: |
              echo "Test execution completed"
              echo "Check the artifacts for detailed reports"
            displayName: 'Test Summary'
          
          # Optional: Add email, Slack, or Teams notifications
          # - task: SendEmail@1
          #   condition: failed()
          #   inputs:
          #     To: 'team@example.com'
          #     Subject: 'Daily Tests Failed - $(Build.BuildNumber)'
          #     Body: 'The daily automated tests have failed. Check Azure DevOps for details.'

